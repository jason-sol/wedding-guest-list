name: wedding-guest-list
services:
  backend:
    cpu_shares: 90
    command: []
    container_name: wedding-guest-backend
    deploy:
      resources:
        limits:
          memory: "536870912"
        reservations:
          devices: []
    environment:
      - NODE_ENV=production
      - PORT=5000
      - TZ=Australia/Sydney
      - CORS_ALLOWED_ORIGINS=*
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-wedding2026}
      - AUTH_USERNAME_2=${AUTH_USERNAME_2:-}
      - AUTH_PASSWORD_2=${AUTH_PASSWORD_2:-}
    build:
      context: .
      dockerfile: Dockerfile.backend
    labels:
      icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/wedding.png
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/wedding-guest-list/data
        target: /app/data
        bind:
          create_host_path: true
    ports: []
    devices: []
    cap_add: []
    networks:
      - wedding_guest_list_network
    privileged: false
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  frontend:
    cpu_shares: 90
    command: []
    container_name: wedding-guest-frontend
    depends_on:
      backend:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          memory: "134217728"
        reservations:
          devices: []
    environment:
      - TZ=Australia/Sydney
    build:
      context: .
      dockerfile: Dockerfile.frontend
    labels:
      icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/wedding.png
    ports:
      - mode: ingress
        target: 80
        published: "70"
        protocol: tcp
    restart: unless-stopped
    volumes: []
    devices: []
    cap_add: []
    networks:
      - wedding_guest_list_network
    privileged: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
networks:
  wedding_guest_list_network:
    name: wedding-guest-list_wedding_guest_list_network
    driver: bridge
x-casaos:
  architectures:
    - amd64
    - arm64
  author: Wedding Guest List
  category: Utilities
  description:
    en_us: A web application for managing wedding guest lists with support for multiple events, individual guests, family groupings, categories, and flexible filtering. Features include multi-event management, family groupings with drag-drop reordering, color-coded category tags, user management with permissions, dark/light mode, and data import/export.
  developer: ""
  hostname: ""
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/wedding.png
  index: /
  is_uncontrolled: false
  main: frontend
  port_map: "70"
  scheme: http
  store_app_id: wedding-guest-list
  tagline:
    en_us: Manage your wedding guest list with ease
  thumbnail: ""
  title:
    custom: ""
    en_us: Wedding Guest List
